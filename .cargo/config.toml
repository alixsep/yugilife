[env]
PKG_CONFIG_PATH = { value = ".cargo/dav1d", relative = true }

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

# WebAssembly SIMD is supported by every browser the app targets, and makes rendering about 10-30%
# faster (see crates/yugilife-wasm).
[target.wasm32-wasip1]
rustflags = ["-C", "target-feature=+simd128"]
