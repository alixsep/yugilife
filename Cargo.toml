[workspace]
resolver = "3"
members = ["crates/yugilife-core", "crates/yugilife-cli", "crates/yugilife-snapshots", "crates/yugilife-wasm"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.1.0"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[profile.dev.package."*"]
opt-level = 3

# The WebAssembly build: release, without the 0.5 MB function name section.
[profile.wasm]
inherits = "release"
strip = true
