<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/yugilife-logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Yugilife" />
    <meta name="apple-mobile-web-app-title" content="Yugilife" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="author" content="Alixsep" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171717" />
    <!-- seo -->
    <script>
      // Links from before path routing used `#/build`, `#/blog/…`. Move them onto the real path
      // before the app reads the location, so every shared link still opens the right page.
      if (location.hash.startsWith("#/")) {
        history.replaceState(null, "", "%BASE_URL%" + location.hash.slice(2))
      }
    </script>
    <script>
      ;(() => {
        try {
          const raw = localStorage.getItem("yugilife-preferences")
          const parsed = raw ? JSON.parse(raw) : null
          const state = parsed?.state ?? parsed
          const storedTheme = state?.theme ?? localStorage.getItem("yugilife-theme")

          if (storedTheme === "light" || storedTheme === "dark") {
            document.documentElement.classList.add(storedTheme)
          }
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
