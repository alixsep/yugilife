# Serves the Pages artifact below /yugilife/, the way GitHub Pages does: each public route is its
# own directory index, and any other path (a saved card's /build/:id) gets the app's 404.html.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Keep the directory redirects (/yugilife/blog -> /yugilife/blog/) relative, so they stay on the
  # host and port the browser used rather than the container's.
  absolute_redirect off;

  error_page 404 /yugilife/404.html;
}
